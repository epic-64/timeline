<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/webstorm-icon-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline Application</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app">
  <div class="controls">
    <button id="addEvent" type="button">Add Event</button>
    <button id="exportEvents" type="button">Export Events</button>
    <button id="importEvents" type="button">Import Events</button>
    <button id="downloadImage" type="button">Download as PNG</button>
    <div class="timeline-settings">
      <label>
        Start Year:
        <input type="number" id="startYear" min="1900" max="2100" step="1" />
      </label>
      <label>
        End Date:
        <input type="date" id="endDate" />
      </label>
    </div>
  </div>
  <div class="timeline-container">
    <div class="timeline-header">
      <div class="timeline-dates" id="timeline-dates"></div>
    </div>
    <div class="timeline-events" id="timeline-events"></div>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
